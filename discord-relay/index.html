<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Discord Relay</title>
<script>
    // Куда ведёт эта ссылка. Чтобы сменить адрес, впишите новый между кавычками и сохраните файл.
    // Пустые кавычки - ссылки пока нет, страница покажет сообщение ниже
    const TARGET = "";
    if (TARGET) location.replace(TARGET);
</script>
<style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e1b18; color: #e8dcc8; font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    a { color: #e0b46a; }
</style>
</head>
<body>
<main>
    <p id="wait">Ссылка на модуль Discord Relay появится позже.<br>The Discord Relay module link will appear later.</p>
</main>
<script>
    if (TARGET) document.getElementById("wait").innerHTML = `Переход… / Redirecting… <a href="${TARGET}">${TARGET}</a>`;
</script>
</body>
</html>
